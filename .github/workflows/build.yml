name: Build PWA Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install PWABuilder CLI
        run: npm install -g @pwabuilder/cli

      - name: Generate Android App Package
        run: |
          pwabuilder package --webManifestUrl "https://wreckeriq-debug.github.io/Salavatshomar/manifest.json" --options '{"platform":"android","appPackageName":"com.salavat.app","appName":"صلوات‌شمار معنوی"}' || true
          
      - name: List files for debug
        run: find . -maxdepth 3

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            *.zip
            android/
            app/
